# The real (~2KB, single-interface) stub — work-runtime's own module metadata strictly constrains this
# to an empty artifact assuming full Guava provides the class elsewhere; forced back to 1.0 below in
# core/data's build.gradle.kts (the only module generating Java stubs against ListenableWorker), the
# standard fix for this well-known WorkManager gotcha.
