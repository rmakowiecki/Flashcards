// Compose compiler stability configuration, applied to every Compose module by the
// `android-compose` convention plugin.

// Domain models live in :core:domain, a pure Kotlin module without the Compose compiler, so the
// compiler can't infer their stability. They are immutable data classes; the Konsist rules
// `domain models have no var properties` and `domain models have no mutable collection
// properties` guard that assumption.
com.rossomak.flashcards.core.domain.model.**

// Read-only collection interfaces. Nothing in this codebase mutates a collection after it is
// published into screen state or a domain model. Caveat: the compiler matches `MutableList`,
// `MutableSet` and `MutableMap` against these entries too and reports them stable, so the
// Konsist rules `Compose modules declare no mutable collection types`, `no cast to a mutable
// collection type` and `domain models have no mutable collection properties` keep mutable
// collection types out instead.
kotlin.collections.List<*>
kotlin.collections.Set<*>
kotlin.collections.Map<*,*>

kotlinx.collections.immutable.*

// Immutable ranges from the standard library, e.g. a settings value held as `IntRange`.
kotlin.ranges.IntRange
